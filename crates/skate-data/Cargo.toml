[package]
name = "skate-data"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
flate2 = "=1.1.10"
skate-core = { path = "../skate-core" }
skate-vfs.workspace = true
skate-audio-formats.workspace = true
serde.workspace = true
serde_json.workspace = true

# The x86_64-exact audio graph is unused by this crate's code and cannot build for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
skate-audio-core.workspace = true
zstd = "=0.13.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = "=0.8.3"
