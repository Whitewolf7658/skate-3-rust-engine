[workspace]
members = ["crates/skate-core", "crates/skate-data", "crates/skate-game", "crates/skate-mods", "crates/skate-vehicles", "crates/skate-net", "crates/skate-steam-relay", "crates/skate-audio-formats", "crates/skate-audio-core", "crates/skate-vfs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = { version = "=0.18.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-vfs = { path = "crates/skate-vfs" }
skate-data = { path = "crates/skate-data" }
skate-audio-formats = { path = "crates/skate-audio-formats" }
skate-audio-core = { path = "crates/skate-audio-core" }

# Web build: release without debug info, thin LTO, many codegen units to bound RAM.
[profile.web]
inherits = "release"
opt-level = "s"
debug = 0
strip = true
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
strip = false

[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
bevy_core_pipeline = { path = "vendor/bevy_core_pipeline" }
